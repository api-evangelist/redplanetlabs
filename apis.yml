apis:
- name: Rama REST API
  description: >-
    In-cluster HTTP+JSON RPC surface exposed by Rama Supervisors (default port
    2000) for appending to depots, querying PStates by navigation path, and
    invoking query topologies. POST-only; no application-level authentication is
    documented (access is governed at the cluster network boundary).
