name: Redplanetlabs
description: >-
  Red Planet Labs builds Rama, a unified backend platform for the JVM
  (Java/Clojure) that consolidates databases, queues, workers, and
  infrastructure into a single programming model — aiming to reduce backend
  complexity by up to 100x while providing ACID semantics, reactive queries,
  fine-grained change detection, and linear scalability. Rama exposes a REST API
  (an in-cluster HTTP+JSON RPC surface for depot appends, PState queries, and
  query-topology invokes), ships a `rama` operations CLI, publishes Maven client
  libraries under the com.rpl groupId, open-sources the Specter data-navigation
  library, and provides first-party Agent Skills for authoring Rama backends.
  Surfaced as a portfolio company of Kindred Ventures and enriched into the API
  Evangelist network.
